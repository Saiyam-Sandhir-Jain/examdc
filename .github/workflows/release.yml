# ════════════════════════════════════════════════════════════════
# ExamdC — Release Pipeline
#
# Triggers: pushing a tag matching v* (e.g. v0.1.0, v1.0.0-rc1)
#
# What it does:
#   1. Builds and tests the project
#   2. Creates a GitHub Release with the CHANGELOG section
#      auto-extracted as release notes
#
# GitHub Packages publishing will be added in Phase 5 once
# the compiler has a Main entry point and produces a JAR.
#
# How to trigger a release:
#   git tag v0.1.0
#   git push origin v0.1.0
# ════════════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Create GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress test

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # Extracts the relevant section from CHANGELOG.md for this version.
      # Looks for content between ## [0.1.0] and the next ## [
      - name: Extract changelog section
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          NOTES=$(sed -n "/^## \[${VERSION}\]/,/^## \[/{ /^## \[${VERSION}\]/d; /^## \[/d; p }" CHANGELOG.md)
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ExamdC v${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.NOTES }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
