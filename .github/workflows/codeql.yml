# ════════════════════════════════════════════════════════════════
# ExamdC — CodeQL Security Analysis
#
# Runs: on push to main, on PRs to main, and weekly on Sunday.
# CodeQL scans Java source for security vulnerabilities and
# common coding mistakes. Results appear in the Security tab.
# ════════════════════════════════════════════════════════════════

name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 0'       # weekly Sunday 06:00 UTC

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write  # needed to upload SARIF results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Build for CodeQL
        run: mvn --batch-mode --no-transfer-progress compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
