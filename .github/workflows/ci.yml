# ════════════════════════════════════════════════════════════════
# ExamdC — Continuous Integration
# Runs on: every push to main/dev, every pull request to main
#
# Jobs:
#   build  — compile + test on Java 11, 17, 21
# ════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      # Run all Java versions even if one fails — shows compatibility range
      fail-fast: false
      matrix:
        java: [ '11', '17', '21' ]

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up JDK ─────────────────────────────────────────
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin          # Eclipse Temurin (formerly AdoptOpenJDK)

      # ── 3. Cache Maven dependencies ───────────────────────────
      # This avoids downloading the entire Maven repo on every run.
      # Cache key: hash of pom.xml — invalidates when dependencies change.
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ── 4. Build ──────────────────────────────────────────────
      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      # ── 5. Test ───────────────────────────────────────────────
      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test

      # ── 6. Upload test results ────────────────────────────────
      # Even on failure, upload the Surefire XML reports so the
      # GitHub Actions UI shows per-test results.
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()                    # upload even if tests fail
        with:
          name: test-results-java${{ matrix.java }}
          path: target/surefire-reports/
          retention-days: 14

      # ── 7. Upload JAR ─────────────────────────────────────────
      # Only on Java 21 (canonical build) so we don't have 3 identical JARs.
      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        if: matrix.java == '21'
        with:
          name: examdc-jar
          path: target/examdc-*-standalone.jar
          retention-days: 30
